<!DOCTYPE html>
<html lang="zh-MY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>华文大冒险：UASA 026 勇者试炼 (All-Blank & 7-Word Wheel Edition)</title>
<style>
  /* ==========================================================================
     JRPG CLASSROOM SMARTBOARD & MOBILE ENGINE (HIGH CONTRAST / RESPONSIVE)
     ========================================================================== */
  :root {
    --bg-main: #060913;
    --bg-card: #0f172a;
    --border-gold: #f59e0b;
    --neon-blue: #38bdf8;
    --neon-green: #22c55e;
    --neon-red: #ef4444;
    --neon-yellow: #fde047;
    --text-pure: #ffffff;
    --text-sub: #cbd5e1;
    --font-scale: 1.0;
    --touch-radius: 18px;
    --shadow-epic: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.25);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #060913 100%);
    color: var(--text-pure);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    font-size: calc(16px * var(--font-scale));
  }

  #game-app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    position: relative;
  }

  /* SCREEN SHAKE ON VERIFICATION REJECTION */
  body.screen-blast-shake {
    animation: screenGlitch 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes screenGlitch {
    10%, 90% { transform: translate3d(-8px, 0, 0) rotate(-0.8deg); }
    20%, 80% { transform: translate3d(10px, 0, 0) rotate(1deg); }
    30%, 50%, 70% { transform: translate3d(-12px, 0, 0) rotate(-1.2deg); }
    40%, 60% { transform: translate3d(12px, 0, 0) rotate(1.2deg); }
  }

  /* ==========================================================================
     TOP HUD
     ========================================================================== */
  .hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid #334155;
    border-radius: var(--touch-radius);
    padding: 6px 14px;
    box-shadow: var(--shadow-epic);
    backdrop-filter: blur(10px);
    z-index: 50;
    gap: 8px;
    flex-shrink: 0;
  }

  .hud-hero {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .hero-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border: 2.5px solid #fde047;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
    flex-shrink: 0;
  }

  .hud-stats {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .stage-badge {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: var(--neon-yellow);
    text-shadow: 0 0 10px rgba(253, 224, 71, 0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .exp-track {
    width: 140px;
    max-width: 100%;
    height: 10px;
    background: #1e293b;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #475569;
  }

  .exp-fill {
    height: 100%;
    width: 10%;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    transition: width 0.4s ease;
  }

  .hud-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .smart-btn {
    background: #1e293b;
    border: 2px solid #475569;
    color: #fff;
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: transform 0.1s, background 0.2s, border-color 0.2s;
    min-height: 40px;
    white-space: nowrap;
  }

  .smart-btn:hover { border-color: var(--neon-blue); background: #334155; }
  .smart-btn:active { transform: scale(0.95); }
  .smart-btn.primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #60a5fa; }
  .smart-btn.gold { background: linear-gradient(135deg, #d97706, #b45309); border-color: #fbbf24; }

  /* ==========================================================================
     ARENA VIEWPORT
     ========================================================================== */
  .arena-viewport {
    flex: 1;
    margin: 8px 0;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: rgba(15, 23, 42, 0.85);
    border: 2.5px solid #334155;
    border-radius: 18px;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
  }

  /* PACER STAGE (PASSAGE READING) */
  .reading-quest-card {
    width: 100%;
    max-width: 1200px;
    background: #0b1120;
    border: 2.5px solid var(--border-gold);
    border-radius: 20px;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-shadow: 0 0 35px rgba(245, 158, 11, 0.25);
    margin: auto 0;
  }

  .reading-meta-tag {
    position: absolute;
    top: -14px;
    background: linear-gradient(90deg, #d97706, #f59e0b);
    color: #000;
    font-weight: 900;
    padding: 4px 18px;
    border-radius: 16px;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .sentence-screen {
    min-height: 140px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    align-content: center;
    gap: 6px 8px;
    margin: 20px 0 16px 0;
    padding: 12px 6px;
    position: relative;
    width: 100%;
  }

  .char-token {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 800;
    color: #f8fafc;
    padding: 2px 4px;
    border-radius: 8px;
    transition: all 0.15s;
    position: relative;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }

  .char-token.punctuation { color: var(--neon-blue); padding: 0 2px; }
  .char-token.active-pop {
    color: #000 !important;
    background: var(--neon-yellow) !important;
    transform: scale(1.3) translateY(-6px);
    border-radius: 10px;
    box-shadow: 0 0 20px var(--neon-yellow);
    z-index: 20;
  }

  #bookworm-pacer {
    position: absolute;
    width: 64px;
    height: 64px;
    pointer-events: none;
    z-index: 40;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    top: 0;
    left: 0;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
  }

  /* ==========================================================================
     ALL-BLANK SENTENCE ENGINE (WORDS & PUNCTUATION)
     ========================================================================== */
  .cloze-quest-card {
    width: 100%;
    max-width: 1300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin: auto 0;
  }

  .cloze-header {
    width: 100%;
    background: linear-gradient(90deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
    border-left: 6px solid var(--neon-yellow);
    padding: 12px 16px;
    border-radius: 0 14px 14px 0;
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: bold;
    line-height: 1.4;
  }

  .cloze-sentence-display {
    width: 100%;
    background: #0b1120;
    border: 2.5px solid #334155;
    border-radius: 18px;
    padding: 18px 14px;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    gap: 8px 6px;
    line-height: 2.2;
  }

  /* INDIVIDUAL BLANK SLOTS */
  .blank-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    padding: 0 10px;
    background: #1e293b;
    border: 2px dashed var(--neon-blue);
    border-radius: 14px;
    color: var(--neon-yellow);
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    position: relative;
  }

  .blank-slot.word-slot {
    min-width: 86px;
  }

  .blank-slot.punct-slot {
    min-width: 46px;
    padding: 0 6px;
    border-color: #a855f7;
    background: #18112c;
  }

  .blank-slot.filled {
    border-style: solid;
    border-color: var(--neon-yellow);
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #ffffff;
    box-shadow: 0 0 16px rgba(253, 224, 71, 0.45);
  }

  .blank-slot:hover {
    transform: scale(1.05);
    border-color: #fde047;
    z-index: 10;
  }

  .blank-slot:active {
    transform: scale(0.95);
  }

  /* STRIKING REJECTION / SHATTER ANIMATION (WHEN INCORRECT) */
  .blank-slot.shatter-rejection, .word-chip.shatter-rejection {
    animation: blastError 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    background: #7f1d1d !important;
    border-color: #ef4444 !important;
    border-style: solid !important;
    color: #ffffff !important;
  }

  @keyframes blastError {
    0% { transform: scale(1); box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
    20% { transform: scale(1.15) rotate(-4deg); box-shadow: 0 0 40px 14px #ef4444; border-color: #fca5a5; }
    40% { transform: scale(1.1) rotate(4deg); box-shadow: 0 0 35px 10px #dc2626; }
    60% { transform: scale(1.05) rotate(-2deg); }
    80% { transform: scale(0.94); opacity: 0.85; }
    100% { transform: scale(1); opacity: 1; border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.85); }
  }

  /* SUCCESS PULSE */
  .blank-slot.success-pulse, .word-chip.success-pulse {
    background: linear-gradient(135deg, #15803d, #166534) !important;
    border-color: #4ade80 !important;
    border-style: solid !important;
    color: #ffffff !important;
    box-shadow: 0 0 25px #22c55e !important;
    animation: pulseWin 0.6s ease;
  }

  @keyframes pulseWin {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* VERIFY ACTION BAR */
  .verify-zone {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
  }

  .verify-btn {
    min-width: 220px;
    max-width: 90%;
    height: 56px;
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
    border-radius: 16px;
    border: 2.5px solid #fbbf24;
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .verify-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px rgba(245, 158, 11, 0.85);
  }

  .verify-btn:active {
    transform: scale(0.95);
  }

  /* ==========================================================================
     REARRANGING WORD BLOCKS (BAHAGIAN D ENGINE)
     ========================================================================== */
  .reorder-quest-card {
    width: 100%;
    max-width: 1260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin: auto 0;
  }

  .reorder-header {
    width: 100%;
    background: linear-gradient(90deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
    border-left: 6px solid var(--neon-yellow);
    padding: 12px 16px;
    border-radius: 0 14px 14px 0;
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: bold;
    line-height: 1.4;
  }

  .reorder-zone-title {
    font-size: 0.95rem;
    color: var(--neon-yellow);
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .reorder-target-zone {
    width: 100%;
    min-height: 90px;
    background: #070d1e;
    border: 2px dashed var(--neon-yellow);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    gap: 8px 6px;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
  }

  .reorder-target-zone.empty-tip::before {
    content: "👆 点击下方待选词块，依正确语序装填至此处...";
    color: #64748b;
    font-size: 0.95rem;
    font-weight: bold;
    font-style: italic;
  }

  .reorder-pool-zone {
    width: 100%;
    min-height: 80px;
    background: #0b1120;
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 6px;
  }

  .word-chip {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 2px solid #64748b;
    border-radius: 12px;
    color: #ffffff;
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 800;
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    transition: all 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1.2;
  }

  .word-chip:hover {
    border-color: var(--neon-blue);
    background: #1e3a8a;
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
  }

  .word-chip:active {
    transform: scale(0.95);
  }

  .word-chip.placed {
    border-color: var(--neon-yellow);
    background: linear-gradient(135deg, #1e3a8a, #172554);
    box-shadow: 0 0 12px rgba(253, 224, 71, 0.35);
  }

  /* ==========================================================================
     ROTATING WHEEL OF 7 WORD BLOCKS MODAL (SCALED FOR MOBILE TOUCH)
     ========================================================================== */
  .wheel-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: rgba(3, 7, 18, 0.88);
    backdrop-filter: blur(14px);
    z-index: 300;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 10px;
    overflow: hidden;
  }

  .wheel-chassis {
    width: 640px;
    height: 640px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-origin: center center;
    flex-shrink: 0;
  }

  .wheel-spinner-ring {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    border: 4px dashed rgba(56, 189, 248, 0.6);
    box-shadow: 0 0 45px rgba(56, 189, 248, 0.25);
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .wheel-word-node {
    position: absolute;
    min-width: 130px;
    min-height: 60px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 3px solid #64748b;
    border-radius: 16px;
    color: #ffffff;
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 800;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
    margin-left: -65px;
    margin-top: -30px;
    line-height: 1.3;
  }

  .wheel-word-node:hover {
    border-color: var(--neon-yellow);
    background: #1e3a8a;
    transform: scale(1.12) !important;
    z-index: 50;
    box-shadow: 0 0 25px var(--neon-yellow);
  }

  .wheel-word-node:active {
    transform: scale(0.95) !important;
  }

  .wheel-center-hub {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, #1e293b 40%, #0f172a 100%);
    border: 4px solid var(--border-gold);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
    z-index: 40;
    cursor: pointer;
    padding: 8px;
  }

  .wheel-center-hub:hover {
    transform: scale(1.05);
  }

  .wheel-controls-bar {
    position: absolute;
    bottom: 25px;
    display: flex;
    gap: 16px;
    z-index: 40;
  }

  /* ==========================================================================
     BAHAGIAN A (MCQ ARENA)
     ========================================================================== */
  .minigame-card {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: auto 0;
  }

  .battle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 6px;
  }

  .battle-option-card {
    background: #1e293b;
    border: 2.5px solid #334155;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 64px;
  }

  .battle-option-card:hover {
    border-color: var(--neon-blue);
    background: #27354f;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
  }

  .battle-option-card:active { transform: scale(0.96); }

  .option-badge-jrpg {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #0f172a;
    border: 2px solid var(--neon-blue);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--neon-blue);
    flex-shrink: 0;
  }

  .option-text-jrpg {
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 700;
    color: #ffffff;
    line-height: 1.35;
  }

  /* ==========================================================================
     BOTTOM CONTROLLER BAR
     ========================================================================== */
  .footer-controller {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid #334155;
    border-radius: var(--touch-radius);
    padding: 8px 12px;
    box-shadow: var(--shadow-epic);
    backdrop-filter: blur(10px);
    z-index: 50;
    gap: 8px;
    flex-shrink: 0;
  }

  .nav-btn {
    min-width: 120px;
    height: 48px;
    font-size: calc(1rem * var(--font-scale));
    font-weight: 900;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    color: #fff;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .nav-btn.prev-btn { background: #334155; border-color: #64748b; }
  .nav-btn.prev-btn:hover { background: #475569; }

  .nav-btn.next-btn {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    border-color: #60a5fa;
    box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
  }
  .nav-btn.next-btn:hover { transform: scale(1.03); }

  .nav-btn.menu-btn {
    background: linear-gradient(135deg, #059669, #047857);
    border-color: #34d399;
  }

  /* TOAST BANNER */
  #game-toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: #1e1b4b;
    border: 2.5px solid var(--neon-yellow);
    border-radius: 14px;
    padding: 10px 20px;
    font-size: 1.15rem;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 0 30px rgba(253, 224, 71, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 500;
    max-width: 90vw;
    text-align: center;
  }

  #game-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* WARP / LEVEL SELECT MODAL */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;

function getMalaysiaDate() {
  const now = new Date();
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  return new Date(utc + (3600000 * 8));
}

function formatMYTDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function formatMYTTime(d) {
  const pad = n => n < 10 ? '0' + n : n;
  let h = d.getHours();
  let m = d.getMinutes();
  let s = d.getSeconds();
  const ampm = h >= 12 ? '下午' : '上午';
  h = h % 12 || 12;
  return `${ampm} ${pad(h)}:${pad(m)}:${pad(s)}`;
}

    osc.start(now);

/* ==========================================================================
   GLOBAL GAME STATE
   ========================================================================== */
let currentStageIndex = 0;
let fontScale = 1.0;
let userExp = 100;
let isSpeaking = false;
let currentUtterance = null;
let sentenceIndex = 0;
let speechTimer = null;

let stageCleared = {};
let maxUnlockedStageIndex = 0;

let activeBlankId = null;
let activeBlankElement = null;
let wheelRotationDegrees = 0;
let currentBlankAnswers = {};

let currentReorderPlaced = [];
let currentReorderPool = [];

// DOM Elements
const arena = document.getElementById("arena-viewport");
const hudTitle = document.getElementById("hud-stage-title");
const hudExpFill = document.getElementById("hud-exp-fill");
const questModal = document.getElementById("quest-modal");
const warpGrid = document.getElementById("warp-grid");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const wheelModal = document.getElementById("wheel-modal");
const wheelRing = document.getElementById("wheel-ring");

/* ==========================================================================
   INITIALIZATION & RESIZE HANDLING
   ========================================================================== */
window.addEventListener("DOMContentLoaded", () => {
  sessionTimes.startObj = getMalaysiaDate();
  buildWarpGrid();
  renderStage(0);
  window.addEventListener("resize", onWindowResize);
});

function onWindowResize() {
  adjustWheelScale();
  const pacer = document.getElementById("bookworm-pacer");
  if (pacer && STAGES[currentStageIndex].type === "reading") {
    positionBoobuOnChar(0);
  }
}

function adjustFontSize(delta) {
  fontScale = Math.max(0.85, Math.min(1.4, fontScale + delta));
  document.documentElement.style.setProperty("--font-scale", fontScale);
  SFX.playClick();
}

function toggleAudioEngine() {
  SFX.enabled = !SFX.enabled;
  const btn = document.getElementById("sound-toggle-btn");
  btn.innerText = SFX.enabled ? "🔊 音效" : "🔈 静音";
  SFX.playClick();
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function showToast(msg) {
  const toast = document.getElementById("game-toast");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

function addExp(amount) {
  userExp += amount;
  const progress = Math.min(100, Math.round((currentStageIndex / (STAGES.length - 1)) * 100));
  hudExpFill.style.width = `${Math.max(10, progress)}%`;
}

function markStageCleared(idx) {
  stageCleared[idx] = true;
  if (idx >= maxUnlockedStageIndex) {
    maxUnlockedStageIndex = Math.min(STAGES.length - 1, idx + 1);
  }
  updateNavButtons();
  buildWarpGrid();
}

function updateNavButtons() {
  btnPrev.disabled = currentStageIndex === 0;
  btnPrev.style.opacity = currentStageIndex === 0 ? "0.4" : "1";
  btnPrev.style.cursor = currentStageIndex === 0 ? "not-allowed" : "pointer";

  const isCleared = !!stageCleared[currentStageIndex];
  const isLast = currentStageIndex === STAGES.length - 1;

  if (isLast) {
    btnNext.disabled = true;
    btnNext.style.opacity = "0.4";
    btnNext.style.cursor = "not-allowed";
  } else if (!isCleared) {
    btnNext.disabled = false;
    btnNext.style.opacity = "0.4";
    btnNext.style.cursor = "not-allowed";
  } else {
    btnNext.disabled = false;
    btnNext.style.opacity = "1";
    btnNext.style.cursor = "pointer";
  }
}

/* ==========================================================================
   NAVIGATION ENGINE
   ========================================================================== */
function goToPrevStage() {
  stopAllAudio();
  if (currentStageIndex > 0) {
    currentStageIndex--;
    renderStage(currentStageIndex);
    SFX.playClick();
  }
}

function goToNextStage() {
  stopAllAudio();
  if (!stageCleared[currentStageIndex]) {
    SFX.playWrongHeavy();
    showToast("⚠️ 当前关卡尚未通关，禁止跳关！请先正确答题并完成校验。");
    return;
  }
  if (currentStageIndex < STAGES.length - 1) {
    currentStageIndex++;
    renderStage(currentStageIndex);
    SFX.playClick();
  }
}

function warpToStage(idx) {
  if (idx > maxUnlockedStageIndex) {
    SFX.playWrongHeavy();
    showToast("🔒 前方关卡尚未解锁！严禁跳关，请按顺序完成每一关考核！");
    return;
  }
  stopAllAudio();
  currentStageIndex = idx;
  renderStage(idx);
  closeQuestMenu();
  SFX.playClick();
}

function openQuestMenu() {
  SFX.playClick();
  buildWarpGrid();
  questModal.style.display = "flex";
}

function closeQuestMenu() {
  SFX.playClick();
  questModal.style.display = "none";
}

function buildWarpGrid() {
  warpGrid.innerHTML = "";
  STAGES.forEach((stage, idx) => {
    const isUnlocked = idx <= maxUnlockedStageIndex;
    const isDone = !!stageCleared[idx];
    const tile = document.createElement("div");
    tile.className = "warp-tile" + (!isUnlocked ? " locked" : "");
    tile.id = `warp-tile-${idx}`;
    tile.innerHTML = `
      <div class="tile-title">${!isUnlocked ? "🔒 " : (isDone ? "✓ " : "")}${stage.id}</div>
      <div class="tile-sub">${stage.title.split("：")[0]}</div>
    `;
    tile.onclick = () => warpToStage(idx);
    warpGrid.appendChild(tile);
  });
}

/* ==========================================================================
   STAGE RENDER DISPATCHER
   ========================================================================== */
function renderStage(idx) {
  stopAllAudio();
  const stage = STAGES[idx];
  hudTitle.innerText = `${stage.chapter} - ${stage.title}`;
  addExp(20);

  updateNavButtons();

  document.querySelectorAll(".warp-tile").forEach((tile, tIdx) => {
    tile.classList.toggle("active", tIdx === idx);
  });

  if (stage.type === "reading") {
    renderReadingStage(stage);
  } else if (stage.type === "mcq") {
    renderMcqStage(stage);
  } else if (stage.type === "all_blanks") {
    renderAllBlanksStage(stage);
  } else if (stage.type === "reorder") {
    renderReorderStage(stage);
  } else if (stage.type === "finale") {
    renderFinaleStage(stage);
  }
}

/* ==========================================================================
   PACER READING ENGINE: SENTENCE-BY-SENTENCE
   ========================================================================== */
function renderReadingStage(stage) {
  sentenceIndex = 0;
  arena.innerHTML = `
    <div class="reading-quest-card">
      <div class="reading-meta-tag">📖 书虫布布伴读 · 逐句研析</div>
      <div style="font-size: 0.95rem; color: #94a3b8; margin-top: 10px; text-align: center;">${stage.source}</div>

      <div id="bookworm-pacer">
        ${document.getElementById("svg-boobu").outerHTML}
      </div>

      <div class="sentence-screen" id="sentence-screen"></div>

      <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px; align-items:center;">
        <button class="smart-btn" onclick="prevSentence()">⏮ 上一句</button>
        <button class="smart-btn primary" id="btn-read-tts" onclick="speakCurrentSentence()">🔊 朗读此句</button>
        <button class="smart-btn" onclick="nextSentence()">下一句 ⏭</button>
      </div>

      <div style="margin-top: 10px; font-size: 0.9rem; color: #38bdf8;" id="sentence-counter">
        第 1 句 / 共 ${stage.sentences.length} 句
      </div>
    </div>
  `;
  displaySentence(stage, 0);
}

function displaySentence(stage, sIdx) {
  stopAllAudio();
  const screen = document.getElementById("sentence-screen");
  const counter = document.getElementById("sentence-counter");
  const rawText = stage.sentences[sIdx];
  counter.innerText = `第 ${sIdx + 1} 句 / 共 ${stage.sentences.length} 句`;

  screen.innerHTML = "";
  const chars = Array.from(rawText);
  chars.forEach((ch, cIdx) => {
    const span = document.createElement("span");
    span.className = "char-token" + (/[，。！？“”：；—]/.test(ch) ? " punctuation" : "");
    span.id = `token-${cIdx}`;
    span.innerText = ch;
    screen.appendChild(span);
  });

  setTimeout(() => positionBoobuOnChar(0), 100);

  if (sIdx === stage.sentences.length - 1) {
    markStageCleared(currentStageIndex);
  }
}

function prevSentence() {
  const stage = STAGES[currentStageIndex];
  if (sentenceIndex > 0) {
    sentenceIndex--;
    displaySentence(stage, sentenceIndex);
    SFX.playClick();
  }
}

function nextSentence() {
  const stage = STAGES[currentStageIndex];
  if (sentenceIndex < stage.sentences.length - 1) {
    sentenceIndex++;
    displaySentence(stage, sentenceIndex);
    SFX.playClick();
  } else {
    markStageCleared(currentStageIndex);
    showToast("🎉 本篇章已精读完毕！已解锁下一关！");
    SFX.playCorrect();
  }
}

function positionBoobuOnChar(charIndex) {
  const pacer = document.getElementById("bookworm-pacer");
  const token = document.getElementById(`token-${charIndex}`);
  if (!pacer || !token) return;

  const parentRect = (pacer.offsetParent || arena).getBoundingClientRect();
  const tokenRect = token.getBoundingClientRect();
  const pacerW = pacer.offsetWidth || 52;
  const pacerH = pacer.offsetHeight || 52;

  const targetX = tokenRect.left - parentRect.left + (tokenRect.width / 2) - (pacerW / 2);
  const targetY = tokenRect.top - parentRect.top - (pacerH * 0.72);

  pacer.style.transform = `translate(${targetX}px, ${targetY}px)`;
}

function speakCurrentSentence() {
  const stage = STAGES[currentStageIndex];
  const sentence = stage.sentences[sentenceIndex];
  stopAllAudio();

  const tokens = Array.from(sentence);
  let activeChar = 0;
  isSpeaking = true;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    currentUtterance = new SpeechSynthesisUtterance(sentence);
    currentUtterance.lang = "zh-CN";
    currentUtterance.rate = 0.88;

    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang && (v.lang.includes("zh") || v.lang.includes("cmn")));
    if (zhVoice) currentUtterance.voice = zhVoice;

    currentUtterance.onboundary = () => {
      const idx = Math.min(tokens.length - 1, activeChar);
      highlightCharToken(idx);
      activeChar++;
    };

    currentUtterance.onend = () => {
      clearCharHighlights();
      isSpeaking = false;
      showToast("⭐ 朗读完毕！");
    };

    window.speechSynthesis.speak(currentUtterance);
  }

  const paceSpeed = 230;
  speechTimer = setInterval(() => {
    if (activeChar >= tokens.length) {
      clearInterval(speechTimer);
      clearCharHighlights();
      return;
    }
    highlightCharToken(activeChar);
    SFX.playHop();
    activeChar++;
  }, paceSpeed);
}

function highlightCharToken(index) {
  clearCharHighlights();
  const token = document.getElementById(`token-${index}`);
  if (token) {
    token.classList.add("active-pop");
    positionBoobuOnChar(index);
  }
}

function clearCharHighlights() {
  document.querySelectorAll(".char-token").forEach(el => el.classList.remove("active-pop"));
}

function stopAllAudio() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
  if (speechTimer) {
    clearInterval(speechTimer);
    speechTimer = null;
  }
  clearCharHighlights();
  isSpeaking = false;
}

/* ==========================================================================
   BAHAGIAN A (MCQ ITEMS)
   ========================================================================== */
function renderMcqStage(stage) {

        <span style="color:var(--neon-blue);">【试炼目标】</span> ${stage.stem}
      </div>

      <div class="battle-grid">
        ${stage.options.map(opt => `
          <div class="battle-option-card" id="opt-${opt.key}" onclick="handleMcqAnswer('${opt.key}', '${stage.answer}')">
            <div class="option-badge-jrpg">${opt.key}</div>
            <div class="option-text-jrpg">${opt.text}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function handleMcqAnswer(selectedKey, correctKey) {
  const card = document.getElementById(`opt-${selectedKey}`);
  if (selectedKey === correctKey) {
    card.style.background = "linear-gradient(135deg, #15803d, #166534)";
    card.style.borderColor = "#4ade80";
    SFX.playCorrect();
    showToast("🎯 命中要害！答案正确！+100 EXP (本关已攻克)");
    addExp(100);
    markStageCleared(currentStageIndex);
  } else {
    card.classList.add("shatter-rejection");
    SFX.playWrongHeavy();
    showToast("🛡️ 招架未果！回答有误，请重新选择！");
    setTimeout(() => card.classList.remove("shatter-rejection"), 850);
  }
}

/* ==========================================================================
   BAHAGIAN B, C: EVERY SINGLE WORD & PUNCTUATION IS A BLANK
   ========================================================================== */
function renderAllBlanksStage(stage) {
  currentBlankAnswers = {};
  
  let sentenceHtml = "";
  stage.tokens.forEach(tok => {
    const slotClass = tok.isPunct ? "blank-slot punct-slot" : "blank-slot word-slot";
    const placeholder = tok.isPunct ? "[标点]" : `[词 ${tok.id + 1}]`;
    sentenceHtml += `
      <span class="${slotClass}" id="blank-slot-${tok.id}" onclick="openWheelForBlank(${tok.id})">
        ${placeholder}
      </span>
    `;
  });

  arena.innerHTML = `
    <div class="cloze-quest-card">
      <div class="cloze-header">
        <span style="color:var(--neon-yellow);">【全词块与标点符文试炼】</span> ${stage.stem}
      </div>

      <div class="cloze-sentence-display" id="cloze-sentence-display">
        ${sentenceHtml}
      </div>

      <div class="verify-zone">
        <button class="verify-btn" onclick="verifyAllBlanksStage()">
          <span>⚔️ 校验全句答案</span>
        </button>
      </div>
    </div>
  `;
}

/* Open 7-Word Rotating Wheel with Mobile Responsive Auto-Scale */
function adjustWheelScale() {
  const chassis = document.querySelector(".wheel-chassis");
  if (!chassis) return;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min((vw - 20) / 640, (vh - 30) / 680, 1);
  chassis.style.transform = `scale(${Math.max(0.48, scale)})`;
}

function openWheelForBlank(blankId) {
  SFX.playClick();
  activeBlankId = blankId;
  activeBlankElement = document.getElementById(`blank-slot-${blankId}`);

  const stage = STAGES[currentStageIndex];
  const tokDef = stage.tokens.find(t => t.id === blankId);
  const sevenOptions = tokDef.options;

  wheelRing.innerHTML = "";
  const radius = 230;
  const count = 7;
  const step = 360 / count;

  sevenOptions.forEach((word, i) => {
    const angle = i * step;
    const rad = (angle * Math.PI) / 180;
    const x = 300 + radius * Math.cos(rad);
    const y = 300 + radius * Math.sin(rad);

    const node = document.createElement("div");
    node.className = "wheel-word-node";
    node.style.left = `${x}px`;
    node.style.top = `${y}px`;
    node.innerText = word;
    node.onclick = (e) => {
      e.stopPropagation();
      pickWordFromWheel(word);
    };
    wheelRing.appendChild(node);
  });

  wheelModal.style.display = "flex";
  adjustWheelScale();
}

function closeWheelModal() {
  SFX.playClick();
  wheelModal.style.display = "none";
}

function spinWheelManual() {
  SFX.playClick();
  wheelRotationDegrees += 51.4;
  wheelRing.style.transform = `rotate(${wheelRotationDegrees}deg)`;
}

function pickWordFromWheel(selectedWord) {
  SFX.playClick();
  currentBlankAnswers[activeBlankId] = selectedWord;
  activeBlankElement.innerText = selectedWord;
  activeBlankElement.classList.add("filled");
  activeBlankElement.classList.remove("shatter-rejection");
  closeWheelModal();
}

function verifyAllBlanksStage() {
  const stage = STAGES[currentStageIndex];
  const tokens = stage.tokens;

  const unfilled = tokens.some(t => !currentBlankAnswers[t.id]);
  if (unfilled) {
    SFX.playWrongHeavy();
    showToast("⚠️ 请先将句子中的每一个词块与标点槽位全部装填完毕！");
    return;
  }

  let hasError = false;

  tokens.forEach(t => {
    const userVal = currentBlankAnswers[t.id];
    const slotEl = document.getElementById(`blank-slot-${t.id}`);

    if (userVal !== t.answer) {
      hasError = true;
      slotEl.classList.remove("success-pulse");
      slotEl.classList.add("shatter-rejection");
    } else {
      slotEl.classList.remove("shatter-rejection");
      slotEl.classList.add("success-pulse");
    }
  });

  if (hasError) {
    document.body.classList.add("screen-blast-shake");
    setTimeout(() => document.body.classList.remove("screen-blast-shake"), 600);
    SFX.playWrongHeavy();
    showToast("❌ 校验失败！高亮红色的词块或标点产生了能量排斥！");
  } else {
    SFX.playCorrect();
    showToast("🌟 符文完全共鸣！整句校验全对！+200 EXP (本关已攻克)");
    addExp(200);
    markStageCleared(currentStageIndex);
  }
}

/* ==========================================================================
   BAHAGIAN D: REARRANGING THE WORD BLOCKS INTO A CORRECT SENTENCE
   ========================================================================= */
function renderReorderStage(stage) {
  currentReorderPlaced = [];
  currentReorderPool = [...stage.scrambledBlocks];

  arena.innerHTML = `
    <div class="reorder-quest-card">
      <div class="reorder-header">
        <span style="color:var(--neon-yellow);">【词块语序重构试炼】</span> ${stage.stem}
      </div>

      <div style="width:100%;">
        <div class="reorder-zone-title">📍 已组装的句子区域 (点击词块撤回)：</div>
        <div class="reorder-target-zone empty-tip" id="reorder-target-zone"></div>
      </div>

      <div style="width:100%;">
        <div class="reorder-zone-title">🗃️ 待选词块池 (点击放入上方组句)：</div>
        <div class="reorder-pool-zone" id="reorder-pool-zone"></div>
      </div>

      <div class="verify-zone" style="flex-wrap:wrap;">
        <button class="smart-btn" style="min-width:110px; height:50px; font-size:1rem;" onclick="resetReorderStage()">
          ↺ 重置
        </button>
        <button class="verify-btn" onclick="verifyReorderStage()">
          <span>⚔️ 校验句子排序</span>
        </button>
      </div>
    </div>
  `;

  renderReorderElements();
}

function renderReorderElements() {
  const targetZone = document.getElementById("reorder-target-zone");
  const poolZone = document.getElementById("reorder-pool-zone");

  if (!targetZone || !poolZone) return;

  targetZone.innerHTML = "";
  poolZone.innerHTML = "";

  if (currentReorderPlaced.length === 0) {
    targetZone.classList.add("empty-tip");
  } else {
    targetZone.classList.remove("empty-tip");
  }

  currentReorderPlaced.forEach((word, idx) => {
    const chip = document.createElement("div");
    chip.className = "word-chip placed";
    chip.innerText = word;
    chip.onclick = () => returnWordToPool(idx);
    targetZone.appendChild(chip);
  });

  currentReorderPool.forEach((word, idx) => {
    const chip = document.createElement("div");
    chip.className = "word-chip";
    chip.innerText = word;
    chip.onclick = () => placeWordToTarget(idx);
    poolZone.appendChild(chip);
  });
}

function placeWordToTarget(poolIdx) {
  SFX.playClick();
  const word = currentReorderPool.splice(poolIdx, 1)[0];
  currentReorderPlaced.push(word);
  renderReorderElements();
}

function returnWordToPool(placedIdx) {
  SFX.playClick();
  const word = currentReorderPlaced.splice(placedIdx, 1)[0];
  currentReorderPool.push(word);
  renderReorderElements();
}

function resetReorderStage() {
  SFX.playClick();
  const stage = STAGES[currentStageIndex];
  currentReorderPlaced = [];
  currentReorderPool = [...stage.scrambledBlocks];
  renderReorderElements();
  showToast("🔄 词块已重置！请重新组句。");
}

function verifyReorderStage() {
  const stage = STAGES[currentStageIndex];

  if (currentReorderPool.length > 0 || currentReorderPlaced.length < stage.correctBlocks.length) {
    SFX.playWrongHeavy();
    showToast("⚠️ 试炼要求：必须将所有词块全部使用完毕后，方可进行校验！");
    return;
  }

  const userSentence = currentReorderPlaced.join("");
  const correctSentence = stage.correctBlocks.join("");
  const targetChips = document.querySelectorAll("#reorder-target-zone .word-chip");

  if (userSentence === correctSentence) {
    targetChips.forEach(chip => {
      chip.classList.remove("shatter-rejection");
      chip.classList.add("success-pulse");
    });
    SFX.playCorrect();
    showToast("🌟 逻辑严谨，排序完全正确！+150 EXP (本关已攻克)");
    addExp(150);
    markStageCleared(currentStageIndex);
  } else {
    document.body.classList.add("screen-blast-shake");
    setTimeout(() => document.body.classList.remove("screen-blast-shake"), 600);
    targetChips.forEach(chip => {
      chip.classList.add("shatter-rejection");
    });
    SFX.playWrongHeavy();
    showToast("❌ 语序有误，句意不合逻辑！请点击词块撤回并重新尝试！");
    setTimeout(() => {
      targetChips.forEach(chip => chip.classList.remove("shatter-rejection"));
    }, 850);
  }
}

function createRawPdfFromImage(dataUrl, w, h) {
  const base64 = dataUrl.split(',')[1];
  const binaryImg = atob(base64);
  const imgLen = binaryImg.length;
  const imgBytes = new Uint8Array(imgLen);
  for (let i = 0; i < imgLen; i++) imgBytes[i] = binaryImg.charCodeAt(i);

  const ptW = 842;
  const ptH = 595;

  const header = "%PDF-1.4\n";
  const obj1 = "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n";
  const obj2 = "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n";
  const obj3 = `3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`;
  const obj4Header = `4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgLen} >>\nstream\n`;
  const obj4Footer = "\nendstream\nendobj\n";

  const streamContent = `q ${ptW} 0 0 ${ptH} 0 0 cm /Im0 Do Q`;
  const obj5 = `5 0 obj\n<< /Length ${streamContent.length} >>\nstream\n${streamContent}\nendstream\nendobj\n`;

  const enc = new TextEncoder();
  const p1 = enc.encode(header + obj1 + obj2 + obj3 + obj4Header);
  const p2 = imgBytes;
  const p3 = enc.encode(obj4Footer + obj5);

  const offset1 = header.length;
  const offset2 = offset1 + obj1.length;
  const offset3 = offset2 + obj2.length;
  const offset4 = offset3 + obj3.length;
  const offset5 = offset4 + obj4Header.length + imgLen + obj4Footer.length;
  const xrefOffset = offset5 + obj5.length;

  const xref = `xref\n0 6\n0000000000 65535 f \n` +
    `${("0000000000" + offset1).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset2).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset3).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset4).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset5).slice(-10)} 00000 n \n` +
    `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;

  const p4 = enc.encode(xref);
  return new Blob([p1, p2, p3, p4], { type: "application/pdf" });
}
